      `Alt + Space`（`ALT-SPACE`），但只在首次初始化、脱战、`TOGGLELYCHEE` 尚无 binding 且
      `ALT-SPACE` 未被其他 action 占用时，通过 `SetBinding("ALT-SPACE", "TOGGLELYCHEE")` 和
      `SaveBindings(GetCurrentBindingSet())` 写入。任何冲突、已有 binding
      或玩家后续修改都保留原状；Lychee 用一次性 `defaultBindingAttempted` 标记避免再次尝试，且绝不使用
      `SetOverrideBinding` 或每次登录重写 binding。第三方 Extension 不注册 Lychee 快捷键，也不调用这些
      Binding API。Toggle 入口在 `InCombatLockdown()` 为 true
