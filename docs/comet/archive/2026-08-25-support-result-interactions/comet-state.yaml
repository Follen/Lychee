      和任务清理路径；`PLAYER_REGEN_ENABLED` 后快捷键无需重新绑定即可恢复。关闭时恢复原 EditBox 只作
      best-effort：对象和相关方法仍可访问时才尝试，否则只清除 Lychee 输入焦点。
