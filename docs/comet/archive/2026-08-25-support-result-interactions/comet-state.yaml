      `BINDING_HEADER_LYCHEE`/`BINDING_NAME_TOGGLELYCHEE` 本地化全局文案。默认唤起键为 `Alt +
      Space`（`ALT-SPACE`）：首次初始化时，仅当 `GetBindingKey("TOGGLELYCHEE")` 没有任何结果且
      `GetBindingAction("ALT-SPACE")` 为空时，才在脱战调用 `SetBinding("ALT-SPACE",
      "TOGGLELYCHEE")` 和 `SaveBindings(GetCurrentBindingSet())`。若 action
      已有绑定或按键已被其他 action 占用，Lychee 不覆盖也不另选默认键；设置页提示玩家自行设置。用 SavedVariables 的一次性
      `defaultBindingAttempted` 标记避免重复尝试；玩家之后在 WoW 按键设置中修改或解绑后，Lychee
      永不自动回写。不得使用 `SetOverrideBinding`，不得在战斗中或每次登录写 Binding。Toggle 入口第一步检查
      `InCombatLockdown()`：战斗中静默返回，不打开、不关闭、不移动焦点、不启动查询。收到
